[project]
name = "claude-imessage-bridge"
version = "0.1.0-pre.1"
description = "Two-way Claude Code over iMessage with per-conversation session routing (macOS)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0,<7.0",
]

# Dev dependencies — the union of every tool CI runs across its parallel
# jobs (pytest, ruff, mypy, bandit, pip-audit, detect-secrets). Install
# all of them locally with:
#
#   pip install -e ".[dev]"
#
# CI itself does NOT use this extra — each job installs only the tools
# it needs for speed (see .github/workflows/ci.yml). The version
# constraints below match what those individual jobs install, so a
# contributor's local gates should reproduce CI's output. If you bump
# a tool version here, bump the matching pin in ci.yml in the same
# commit.
[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    # ruff is pinned EXACT — format output drifts between ruff minor
    # versions, so any non-exact pin would let a contributor produce
    # a `ruff format` that fails CI's pinned check.
    "ruff==0.6.9",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "detect-secrets>=1.5,<2.0",
]

[project.scripts]
imessage-bridge = "src.daemon:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
# B404: importing subprocess is a "consider security implications" warning.
#       We deliberately use subprocess for claude -p and osascript with
#       fully-controlled argv lists; the security implications are the
#       whole subject of docs/THREAT_MODEL.md.
# B603: subprocess call without shell=True. That's exactly what we want —
#       the safe pattern. Bandit flags it because the argv came from a
#       function arg, but every call site validates the argv first
#       (_assert_safe_argv in claude_runner; strict handle regex in
#       imessage_sender) and never invokes a shell.
skips = ["B404", "B603"]

[tool.ruff]
line-length = 100
