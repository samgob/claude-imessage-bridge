# claude-imessage-bridge — config
#
# Copy to ~/.claude-imessage-bridge/config.yaml and fill in the blanks.
# Your real config.yaml is in .gitignore so secrets and personal handles
# stay out of the repo; this example file is the only one checked in.

# Absolute path to where Claude Code sessions should run. Typically your
# main work directory (the one Claude Desktop opens to). The bridge will
# spawn `claude` with this as cwd.
project_directory: /Users/YOU/Desktop/Claude Homebase

# Senders allowed to drive the bot. Use Apple ID email (preferred — strong
# auth) or E.164 phone numbers. Phone entries are also safe because we
# only accept service='iMessage' rows (SMS is dropped at the SQL layer),
# but Apple ID emails are slightly stronger because they're tied to one
# identity that can't be ported.
allowlist:
  - "you@example.com"
  # - "+15551234567"

# Group chats are refused by default. To opt one in, paste its GUID here
# (find via: SELECT guid FROM chat WHERE display_name LIKE '%family%';).
# Anyone in an opted-in group can drive the bot — be conservative.
allow_group_chat_guids: []

# Tools Claude is allowed to USE on inbound messages.
#
# DEFAULT IS EMPTY — text-only chat. No filesystem access.
#
# How the security model actually works (this is critical to understand):
# - Claude Code's `--allowed-tools` flag is ADDITIVE — it doesn't deny
#   anything by itself. Bash, Read, Write, WebFetch etc. are available
#   in `claude -p` BY DEFAULT unless explicitly denied.
# - The bridge passes a comprehensive `--disallowed-tools` list on every
#   invocation. That's what actually keeps Bash unavailable.
# - On every daemon startup, a SELFTEST tries to invoke Bash and refuses
#   to run the bridge unless Bash is empirically denied. If a future
#   Claude Code version changes flag semantics, the daemon stops working
#   until the disallow list is updated.
# - Tools you put in `allowed_tools` here are REMOVED from the active
#   disallow list, so you can opt in to (e.g.) `Read` if you want.
#
# Why empty by default: any filesystem-reading tool can be coerced via
# prompt injection into echoing arbitrary file contents back over
# iMessage, and that reply lands on every Apple-ID-signed-in device
# (including potentially family-shared ones).
#
# Tools that are HARD-FORBIDDEN regardless of what you put here:
# Bash, Write, Edit, MultiEdit, NotebookEdit, WebFetch, WebSearch,
# Skill, Agent, ToolSearch, CronCreate, CronDelete, CronList, CronToggle,
# ScheduleWakeup, RemoteTrigger, PushNotification, EnterWorktree,
# ExitWorktree, and any mcp__* tool. Daemon refuses to start if you
# list any of those.
allowed_tools: []

# Tools that are always denied at the config layer, on top of the
# hard-forbidden set the daemon enforces. Belt-and-suspenders.
forbidden_tools: []

# How often to poll chat.db (seconds). >= 1.0.
poll_interval_seconds: 3.0

# Reply rate limit per minute, per sending handle. Prevents a compromised
# allowlisted contact from burning your cost cap in seconds.
reply_rate_limit_per_minute: 10

# Hard daily $ cap on Claude API spend tracked across all conversations.
# When met, daemon refuses to invoke claude until the next UTC day.
daily_cost_cap_usd: 5.00

# Per-call cost cap. If one claude response somehow spends more than this,
# the bridge logs it and refuses to send the reply (the spend already
# happened, but we suppress the reply that might have been the very thing
# that ran up the bill).
per_call_cost_cap_usd: 0.50

# Cap on claude's tool-use loop length. With allowed_tools=[] and 1 turn,
# this is a single text response with no tool calls. Bump if you opt-in
# to tools and want claude to use them iteratively.
per_call_max_turns: 1

# Per-call timeout. Long-running claude responses are killed at this
# threshold rather than blocking the daemon's main loop indefinitely.
per_call_timeout_seconds: 90

# Auto-PAUSE after this many consecutive Claude failures (timeout, exec
# error, JSON parse error). User sees one iMessage notification, then the
# bridge idles until they remove ~/.claude-imessage-bridge/PAUSE.
circuit_breaker_failures: 5

# Path to the Claude Code CLI binary. Default fits a Homebrew /usr/local
# install; adjust if you installed elsewhere (e.g., the new native installer
# lands it under ~/.local/bin or similar).
claude_binary: /usr/local/bin/claude

# Log message bodies (incoming and outgoing) to STDERR (not state.db).
# OFF by default — leaks content into terminal/launchd logs.
debug: false

# Optional shortcuts for /use. Each key is a short name (^[a-z0-9_-]{1,32}$,
# case-insensitive); the value is the Claude Code session UUID you want
# /use <name> to resume. The bridge does a case-insensitive exact match
# BEFORE running the keyword search, so /use wesco resumes that specific
# session even if the keyword would also match other sessions.
#
# Value can be either a plain string UUID or a mapping with an `id` field
# (the mapping form leaves room for future per-alias options).
#
# session_aliases:
#   wesco: 4fe39c70-21d7-467e-801b-ca3167ac130f
#   arden: {id: 8a1b2c3d-4e5f-6789-abcd-ef0123456789}
session_aliases: {}

# --- Trust mode --------------------------------------------------------
#
# Three named modes pick how much of Claude Code is reachable via this
# bridge. DEFAULT IS 'chat_only' for a reason — that's the safe OSS
# baseline. Solo operators who want full Claude Code on their phone flip
# to 'full'. See docs/THREAT_MODEL.md for the full breakdown.
#
#   chat_only — hermetic sandbox, no tools, no memory. Safe to share.
#   coding    — filesystem-aware Claude without network/MCPs.
#               Real project_directory cwd; CLAUDE.md loads.
#   full      — Claude Code in iMessage. Real cwd, real MCP config,
#               all tools. Use ONLY when you are the only allowlisted
#               handle.
#
# trust:
#   default: chat_only        # safe default
#   per_alias:                # alias-specific overrides
#     family: chat_only       # even when overall default is full

# --- Memory backend ----------------------------------------------------
#
# Pluggable system for injecting curated context into every claude call.
# Active in 'coding' and 'full' trust modes; FORCED to 'none' in
# 'chat_only' regardless of what you set here.
#
#   none      — no memory injection (default)
#   claude_md — load CLAUDE.md as the eager core + lazy-load matching
#               memory/projects/*.md, memory/people/*.md,
#               memory/context/*.md based on token-match against the
#               inbound message. 32KB cap, 5-min cache.
#   custom    — run an operator-provided script; stdin is the message,
#               stdout becomes the context.
#
# memory:
#   backend: claude_md
#   claude_md:
#     root: ~/.claude/CLAUDE.md
#     follow_references: true
#     max_bytes: 32768
#     exclude:
#       - '.*\.env.*'
#       - '.*secrets.*'
#       - '.*tokens.*'
#   custom:
#     script: ''
#     timeout_seconds: 5

# --- Protected files (Session 3) -------------------------------------
# Edits to these specific paths require explicit user approval via the
# permission-relay flow (the bridge sends a "🔒 Reply yes to approve"
# prompt) even when accept_edits is on (the default in `coding` and
# `full` modes).
#
# Default: just CLAUDE.md, which is too foundational to mutate without
# a human in the loop.
#
# protected_files:
#   - ~/.claude/CLAUDE.md
#   - ~/.claude/settings.json

# --- Voice-note transcription (Session 3) ----------------------------
# Audio attachments are transcribed offline via whisper.cpp. Both
# settings are optional — the bridge auto-discovers `whisper-cli` on
# PATH and looks for the model at ~/whisper.cpp/models/ggml-base.en.bin.
# Set explicitly if you've installed elsewhere.
#
# Install (one-time):
#   brew install whisper-cpp
#   mkdir -p ~/whisper.cpp/models
#   curl -L -o ~/whisper.cpp/models/ggml-base.en.bin \
#     https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
#
# whisper_binary: /opt/homebrew/bin/whisper-cli
# whisper_model_path: ~/whisper.cpp/models/ggml-base.en.bin
