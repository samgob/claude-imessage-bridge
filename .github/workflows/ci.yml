name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict the default permissions so workflow tokens can't write the repo.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy + project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mypy types-PyYAML
      - name: mypy
        run: mypy --ignore-missing-imports src/

  security:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install bandit pip-audit
      - name: bandit
        run: bandit -q -r src/ -c pyproject.toml || bandit -q -r src/
      - name: pip-audit
        run: pip-audit --strict
